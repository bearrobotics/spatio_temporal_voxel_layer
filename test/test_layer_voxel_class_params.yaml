# Layer configs for test_layer_voxel_class_params, keyed by layer name.
# YAML anchors keep the shared base in one place.
source_defaults: &source_defaults
  topic: /unused/points
  sensor_frame: camera
  observation_persistence: 0.0
  expected_update_rate: 0.0
  data_type: PointCloud2
  inf_is_valid: false
  clearing: true
  marking: true
  decay_acceleration: 1.0
  clear_after_reading: true
  enabled: true
  filter:
    type: passthrough
  frustrum:
    type: 3d_camera
    vertical_fov_angle: 1.0
    horizontal_fov_angle: 1.2
    min_z: 0.1
    max_z: 5.0

cliff_class: &cliff_class
  decay: 120.0
  priority: 10
  publish_class_voxels: true
  hits_to_promote: 3
  cleared_by:
    frustums: true
    dynamic_obstacles: false
    footprint_clear: false
    front_blind_spot: false
    inter_sensor_decay: false

cliff_source: &cliff_source
  <<: *source_defaults
  topic: /unused/cliff_points
  voxel_class: cliff
  hit_streak:
    misses_to_break: 2

layer_defaults: &layer_defaults
  observation_sources: "camera_source"
  transform_tolerance: 0.2
  enabled: true
  publish_voxel_map: false
  publish_voxel_map_period: 3.0
  voxel_size_costmap_resolution_multiplier: 1.0
  combination_method: 1
  mark_threshold: 0
  update_footprint_enabled: false
  reset_enabled: false
  track_unknown_space: false
  decay_model: 0
  voxel_decay: 15.0
  hardware_robot_radius: 0.3
  mapping_mode: false
  safety_zone:
    enable: false
    point1: [0.0, 0.0]
    point2: [0.1, 0.0]
    point3: [0.0, 0.1]
  dynamic_obstacle_clearing:
    enable: false
    activation_velocity_threshold: 0.1
    min_distance_between_readings_threshold: 0.25
    interpolation_in_future: 0.5
    interpolation_in_past: 0.5
    stale_time_threshold: 2.0
    inflation_radius_factor: 1.5
    number_of_interpolation_circles: 3
    past_time_window: 1.0
    random_walk_probability_limit: 0.1
    max_obstacle_radius: 0.5
    seconds_since_last_random_walk: 0.25
    publish_visualization: false
  robot_motion_clearing:
    enable: false
    topic: /unused/motion
    activation_velocity_threshold: 0.1
    min_distance_between_readings_threshold: 0.25
    stale_time_threshold: 0.75
    inflation_radius_factor: 1.2
    number_of_interpolation_circles: 3
    past_time_window: 1.0
    publish_visualization: false
  camera_source: *source_defaults

classified:
  <<: *layer_defaults
  observation_sources: "camera_source cliff_source vehicle_source"
  publish_voxel_map: true
  clear_grid_on_map_change: true
  clear_grid_on_pose_reset: true
  voxel_classes:
    cliff:
      <<: *cliff_class
      # Written as an int on purpose: yaml authors do, and roscpp promotes it to double.
      store_at_z: 0
    vehicle:
      decay: 30.0
      priority: 5
      publish_class_voxels: true
      cleared_by:
        frustums: true
        dynamic_obstacles: false
        footprint_clear: true
        front_blind_spot: false
        inter_sensor_decay: false
  cliff_source: *cliff_source
  vehicle_source:
    <<: *source_defaults
    topic: /unused/vehicle_points
    voxel_class: vehicle

stale_confirmation_block:
  <<: *layer_defaults
  observation_sources: "camera_source cliff_source"
  voxel_classes:
    cliff:
      <<: *cliff_class
      confirmation:
        frames: 3
  cliff_source: *cliff_source

gated_source_without_hit_streak:
  <<: *layer_defaults
  observation_sources: "camera_source cliff_source"
  voxel_classes:
    cliff: *cliff_class
  cliff_source:
    <<: *source_defaults
    topic: /unused/cliff_points
    voxel_class: cliff

clearing_only_gated_source:
  <<: *layer_defaults
  observation_sources: "camera_source cliff_source"
  voxel_classes:
    cliff: *cliff_class
  cliff_source:
    <<: *source_defaults
    topic: /unused/cliff_points
    voxel_class: cliff
    marking: false

string_misses_to_break:
  <<: *layer_defaults
  observation_sources: "camera_source cliff_source"
  voxel_classes:
    cliff: *cliff_class
  cliff_source:
    <<: *cliff_source
    hit_streak:
      misses_to_break: "2"

hit_streak_without_misses_to_break:
  <<: *layer_defaults
  observation_sources: "camera_source cliff_source"
  voxel_classes:
    cliff: *cliff_class
  cliff_source:
    <<: *cliff_source
    hit_streak:
      misses_to_brea: 2

zero_misses_to_break:
  <<: *layer_defaults
  observation_sources: "camera_source cliff_source"
  voxel_classes:
    cliff: *cliff_class
  cliff_source:
    <<: *cliff_source
    hit_streak:
      misses_to_break: 0

hit_streak_on_ungated_source:
  <<: *layer_defaults
  camera_source:
    <<: *source_defaults
    hit_streak:
      misses_to_break: 2

creation_gated_source:
  <<: *layer_defaults
  camera_source:
    <<: *source_defaults
    hit_streak:
      hits_to_create: 3
      misses_to_break: 2

zero_seconds_to_break:
  <<: *layer_defaults
  camera_source:
    <<: *source_defaults
    hit_streak:
      hits_to_create: 3
      misses_to_break: 2
      seconds_to_break: 0.0

string_seconds_to_break:
  <<: *layer_defaults
  camera_source:
    <<: *source_defaults
    hit_streak:
      hits_to_create: 3
      misses_to_break: 2
      seconds_to_break: "1.5"

nan_seconds_to_break:
  <<: *layer_defaults
  camera_source:
    <<: *source_defaults
    hit_streak:
      hits_to_create: 3
      misses_to_break: 2
      seconds_to_break: .nan

hit_streak_reset:
  <<: *layer_defaults
  observation_sources: "gated_camera"
  gated_camera:
    <<: *source_defaults
    topic: /stvl_layer_params_test/hit_streak_reset_frames
    sensor_frame: ""
    clearing: false
    clear_after_reading: false
    hit_streak:
      hits_to_create: 3
      misses_to_break: 1
      seconds_to_break: 2

zero_hits_to_create:
  <<: *layer_defaults
  camera_source:
    <<: *source_defaults
    hit_streak:
      hits_to_create: 0
      misses_to_break: 2

string_hits_to_create:
  <<: *layer_defaults
  camera_source:
    <<: *source_defaults
    hit_streak:
      hits_to_create: "3"
      misses_to_break: 2

cliff_without_store_at_z:
  <<: *layer_defaults
  voxel_classes:
    cliff: *cliff_class

nan_store_at_z:
  <<: *layer_defaults
  voxel_classes:
    cliff:
      <<: *cliff_class
      store_at_z: .nan

string_store_at_z:
  <<: *layer_defaults
  voxel_classes:
    cliff:
      <<: *cliff_class
      store_at_z: "zero"

generic_only:
  <<: *layer_defaults

vehicle_class_map: &vehicle_class_map
  decay: 30.0
  priority: 5
  publish_class_voxels: false
  publish_class_map: true
  cleared_by:
    frustums: true
    dynamic_obstacles: false
    footprint_clear: false
    front_blind_spot: false
    inter_sensor_decay: false

class_map_publisher: &class_map_publisher
  <<: *layer_defaults
  observation_sources: "vehicle_camera"
  voxel_classes:
    vehicle: *vehicle_class_map
  vehicle_camera:
    <<: *source_defaults
    topic: /stvl_layer_params_test/class_map_frames
    sensor_frame: ""
    clearing: false
    clear_after_reading: false
    voxel_class: vehicle

small_class_map_window:
  <<: *class_map_publisher
  class_map_window_width_m: 4.0

zero_class_map_window:
  <<: *layer_defaults
  class_map_window_width_m: 0.0

nan_class_map_window:
  <<: *layer_defaults
  class_map_window_width_m: .nan

oversized_class_map_window:
  <<: *layer_defaults
  class_map_window_width_m: 100.5

string_class_map_window:
  <<: *layer_defaults
  class_map_window_width_m: "20"

string_publish_class_map:
  <<: *layer_defaults
  voxel_classes:
    vehicle:
      <<: *vehicle_class_map
      publish_class_map: "true"
